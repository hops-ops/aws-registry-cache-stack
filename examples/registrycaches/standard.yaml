apiVersion: aws.hops.ops.com.ai/v1alpha1
kind: RegistryCache
metadata:
  name: platform-registry-cache
  namespace: default
spec:
  accountId: "123456789012"
  region: us-east-2
  clusterName: platform-cluster
  labels:
    team: platform
  tags:
    team: platform
  providerConfigRefs:
    aws:
      name: default
      kind: ProviderConfig
    kubernetes:
      name: platform-cluster
      kind: ProviderConfig
  distribution:
    enabled: true
    namespace: crossplane-system
    # renovate: datasource=docker depName=library/registry registryUrl=https://index.docker.io
    image: registry:3
    storage:
      bucketName: platform-registry-cache
      rootPrefix: distribution
      lifecycle:
        abortIncompleteMultipartUploadDays: 7
    podIdentity:
      rolePrefix: platform-
    upstreams:
      - name: docker-hub
        sourceRegistry: registry-1.docker.io
        matchPrefix: docker.io
        remoteUrl: https://registry-1.docker.io
      - name: ghcr
        sourceRegistry: ghcr.io
      - name: quay
        sourceRegistry: quay.io
      - name: ecr-public
        sourceRegistry: public.ecr.aws
      - name: kubernetes
        sourceRegistry: registry.k8s.io
      - name: xpkg-crossplane
        sourceRegistry: xpkg.crossplane.io
      - name: xpkg-upbound
        sourceRegistry: xpkg.upbound.io
