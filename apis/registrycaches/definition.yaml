apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: registrycaches.aws.hops.ops.com.ai
spec:
  group: aws.hops.ops.com.ai
  names:
    categories:
      - crossplane
    kind: RegistryCache
    singular: registrycache
    plural: registrycaches
  scope: Namespaced
  defaultCompositeDeletePolicy: Foreground
  versions:
  - name: v1alpha1
    referenceable: true
    served: true
    schema:
      openAPIV3Schema:
        description: RegistryCache manages S3-backed CNCF Distribution proxy caches for OCI registries.
        type: object
        properties:
          spec:
            description: RegistryCacheSpec defines proxy cache behavior for one AWS account, region, and target cluster.
            type: object
            properties:
              accountId:
                description: AWS account ID used for IAM and default bucket naming.
                type: string
                pattern: "^[0-9]{12}$"
              region:
                description: AWS region for S3 and PodIdentity resources.
                type: string
                minLength: 1
              clusterName:
                description: Target EKS cluster name. Used as the default Kubernetes ProviderConfig name and PodIdentity cluster name.
                type: string
              managementPolicies:
                description: Management policies for composed resources. Defaults to ["*"].
                type: array
                items:
                  type: string
                  enum:
                  - "*"
                  - Create
                  - Observe
                  - Update
                  - Delete
                  - LateInitialize
                default:
                - "*"
              labels:
                description: Custom labels applied to all composed Kubernetes resources.
                type: object
                additionalProperties:
                  type: string
                x-kubernetes-preserve-unknown-fields: true
              tags:
                description: Custom tags passed to taggable AWS resources.
                type: object
                additionalProperties:
                  type: string
                x-kubernetes-preserve-unknown-fields: true
              providerConfigRefs:
                description: ProviderConfig references for AWS and Kubernetes providers.
                type: object
                properties:
                  aws:
                    description: AWS ProviderConfig reference. Defaults to ProviderConfig/default.
                    type: object
                    properties:
                      name:
                        type: string
                        default: default
                      kind:
                        type: string
                        default: ProviderConfig
                  kubernetes:
                    description: Kubernetes ProviderConfig reference. Defaults to clusterName, then default.
                    type: object
                    properties:
                      name:
                        type: string
                      kind:
                        type: string
                        enum:
                        - ProviderConfig
                        - ClusterProviderConfig
                        default: ProviderConfig
              distribution:
                description: CNCF Distribution proxy cache configuration.
                type: object
                properties:
                  enabled:
                    description: Whether to render Distribution proxy cache deployments.
                    type: boolean
                    default: false
                  namespace:
                    description: Namespace for Distribution proxy cache deployments. Defaults to crossplane-system.
                    type: string
                    default: crossplane-system
                  createNamespace:
                    description: Whether this stack should create the Distribution namespace.
                    type: boolean
                    default: false
                  image:
                    description: Distribution registry image.
                    type: string
                    # renovate: datasource=docker depName=library/registry registryUrl=https://index.docker.io
                    default: registry:3
                  imagePullPolicy:
                    type: string
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    default: IfNotPresent
                  replicas:
                    description: Number of replicas per upstream proxy cache.
                    type: integer
                    minimum: 1
                    default: 1
                  serviceAccount:
                    description: Distribution ServiceAccount settings.
                    type: object
                    properties:
                      name:
                        description: ServiceAccount name. Defaults to <xr-name>-distribution.
                        type: string
                      annotations:
                        type: object
                        additionalProperties:
                          type: string
                        x-kubernetes-preserve-unknown-fields: true
                      labels:
                        type: object
                        additionalProperties:
                          type: string
                        x-kubernetes-preserve-unknown-fields: true
                  podIdentity:
                    description: Optional AWS PodIdentity for Distribution S3 permissions.
                    type: object
                    properties:
                      enabled:
                        description: Whether to compose an aws.hops PodIdentity for the Distribution ServiceAccount.
                        type: boolean
                        default: true
                      rolePrefix:
                        type: string
                      roleNameOverride:
                        type: string
                      permissionsBoundaryArn:
                        type: string
                  storage:
                    description: S3 storage settings for Distribution proxy caches.
                    type: object
                    properties:
                      bucketName:
                        description: S3 bucket name. Defaults to a sanitized account/region/XR-derived name.
                        type: string
                      createBucket:
                        description: Whether this stack should create and protect the S3 bucket.
                        type: boolean
                        default: true
                      rootPrefix:
                        description: Shared S3 key prefix for Distribution cache objects.
                        type: string
                        default: distribution
                      encrypt:
                        description: Enable S3 server-side encryption in the Distribution storage driver.
                        type: boolean
                        default: true
                      secure:
                        description: Use HTTPS for S3 API calls from Distribution.
                        type: boolean
                        default: true
                      v4Auth:
                        description: Use AWS Signature Version 4 for S3 API calls.
                        type: boolean
                        default: true
                      regionEndpoint:
                        description: Optional custom S3-compatible endpoint.
                        type: string
                      forcePathStyle:
                        description: Use path-style addressing for S3-compatible endpoints.
                        type: boolean
                        default: false
                      lifecycle:
                        description: Optional S3 lifecycle settings for cache storage hygiene.
                        type: object
                        properties:
                          enabled:
                            description: Whether to render an S3 lifecycle configuration.
                            type: boolean
                            default: true
                          abortIncompleteMultipartUploadDays:
                            description: Days before aborting incomplete multipart uploads.
                            type: integer
                            minimum: 1
                            default: 7
                  gateway:
                    description: Optional Gateway API exposure through an existing trusted Istio Gateway. This keeps Distribution Services internal while giving node image pulls a DNS-resolvable HTTPS endpoint.
                    type: object
                    properties:
                      enabled:
                        description: Whether to render HTTPRoutes for upstream proxy caches. Defaults to false.
                        type: boolean
                        default: false
                      hostname:
                        description: Shared registry cache hostname served by the existing Gateway, such as rc.example.com. Required when gateway exposure is enabled unless every upstream sets gateway.hostname.
                        type: string
                      port:
                        description: External registry port used in generated ImageConfig prefixes. Defaults to 443.
                        type: integer
                        minimum: 1
                        maximum: 65535
                        default: 443
                      gatewayRef:
                        description: Gateway API parentRef that HTTPRoutes attach to.
                        type: object
                        properties:
                          name:
                            description: Gateway metadata.name. Defaults to platform.
                            type: string
                            default: platform
                          namespace:
                            description: Gateway namespace. Defaults to istio-ingress.
                            type: string
                            default: istio-ingress
                          sectionNames:
                            description: Gateway listener section names. Defaults to [https-apex].
                            type: array
                            items:
                              type: string
                            default:
                            - https-apex
                  upstreams:
                    description: Upstream registries to proxy. Each upstream renders one Distribution deployment.
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          description: Stable name used for composed resource keys.
                          type: string
                          minLength: 1
                          maxLength: 40
                          pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                        sourceRegistry:
                          description: Source registry host used for default matching, such as ghcr.io.
                          type: string
                          minLength: 1
                        matchPrefix:
                          description: Image reference prefix to rewrite. Defaults to sourceRegistry.
                          type: string
                        remoteUrl:
                          description: Full upstream registry URL. Defaults to https://<sourceRegistry>.
                          type: string
                        ttl:
                          description: Distribution proxy cache TTL.
                          type: string
                          default: 168h
                        rootDirectory:
                          description: Optional S3 root directory for this upstream. Defaults to /<rootPrefix>/<name>.
                          type: string
                        rewrite:
                          description: Optional Crossplane ImageConfig rewrite for this upstream.
                          type: object
                          properties:
                            enabled:
                              description: Whether to render an ImageConfig rewriting matchPrefix to the proxy cache. Enable only when rewrite.prefix or gateway exposure is reachable by both Crossplane pods and node image pulls.
                              type: boolean
                              default: false
                            prefix:
                              description: Rewrite target prefix. Defaults to the generated Gateway hostname/path when gateway exposure is enabled. Otherwise this is required when rewrite.enabled is true.
                              type: string
                            imageConfigName:
                              description: Optional ImageConfig name. Defaults to <xr-name>-distribution-<upstream-name>.
                              type: string
                        service:
                          description: Kubernetes Service settings for the upstream proxy.
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - ClusterIP
                              - NodePort
                              - LoadBalancer
                              default: ClusterIP
                            port:
                              type: integer
                              minimum: 1
                              maximum: 65535
                              default: 5000
                        gateway:
                          description: Optional per-upstream Gateway API exposure overrides.
                          type: object
                          properties:
                            enabled:
                              description: Whether to render an HTTPRoute for this upstream. Defaults to distribution.gateway.enabled.
                              type: boolean
                            hostname:
                              description: Hostname for this upstream route. Defaults to distribution.gateway.hostname.
                              type: string
                            pathPrefix:
                              description: Path segment under the hostname used to select this upstream. Defaults to a normalized matchPrefix, such as xpkg-crossplane-io.
                              type: string
                        resources:
                          description: Container resource requests and limits for this upstream.
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                      required:
                      - name
                      - sourceRegistry
            required:
            - accountId
            - region
          status:
            description: RegistryCacheStatus exposes proxy cache readiness and connection details.
            type: object
            properties:
              ready:
                type: boolean
              distribution:
                type: object
                properties:
                  enabled:
                    type: boolean
                  ready:
                    type: boolean
                  namespace:
                    type: string
                  bucketName:
                    type: string
                  upstreams:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        ready:
                          type: boolean
                        sourceRegistry:
                          type: string
                        matchPrefix:
                          type: string
                        remoteUrl:
                          type: string
                        serviceName:
                          type: string
                        httpRouteName:
                          type: string
                        gatewayHostname:
                          type: string
                        gatewayPathPrefix:
                          type: string
                        rewritePrefix:
                          type: string
        required:
        - spec
